<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My New Year Promise</title>
<meta name="description" content="Receive a promise from God's Word for the new year.">
<meta name="theme-color" content="#1a1205">

<style>
:root{--ink:#fbf3e0;--muted:#d8c8a4;--gold:#f2c75c;--gold-l:#fff1b8;--gold-m:#e0a93a;--gold-d:#a8721c;--gold-x:#6e4710;--bg1:#0d0904;--bg2:#2a1d08;--line:rgba(242,199,92,.55);--wa:#17703d;--wa-d:#0d4a27;
 --metal:linear-gradient(180deg,#fff1b8 0%,#f2c75c 22%,#e0a93a 50%,#c4892a 72%,#f0c869 100%)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);line-height:1.5;
 background:radial-gradient(90% 60% at 50% -5%,rgba(242,199,92,.38) 0%,rgba(242,199,92,0) 60%),radial-gradient(70% 50% at 50% 110%,rgba(224,169,58,.18),rgba(0,0,0,0) 70%),linear-gradient(180deg,var(--bg2),var(--bg1) 75%);background-attachment:fixed;min-height:100vh}
main{max-width:640px;margin:0 auto;padding:48px 16px 32px;min-height:100vh;display:flex;flex-direction:column;perspective:1200px}
[hidden]{display:none!important}
.gold-text{background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
h1,.church{font-family:Georgia,serif;font-weight:700;font-size:clamp(1.4rem,7.2vw,2.8rem);line-height:1.15;margin:0 0 14px;text-align:center;filter:drop-shadow(0 2px 0 #6e4710) drop-shadow(0 6px 12px rgba(0,0,0,.55))}
.tagline{text-align:center;color:var(--muted);font-style:italic;margin:0 0 34px;font-family:Georgia,serif;font-size:1.1rem}
.cross{display:block;margin:0 auto 18px;width:52px;height:52px;filter:drop-shadow(0 3px 0 #6e4710) drop-shadow(0 8px 14px rgba(0,0,0,.5))}
form{position:relative;border-radius:22px;padding:26px;background:linear-gradient(160deg,rgba(255,236,180,.12),rgba(255,236,180,.03) 60%);border:1px solid var(--line);
 box-shadow:inset 0 1px 0 rgba(255,241,184,.35),0 2px 0 rgba(110,71,16,.9),0 24px 50px rgba(0,0,0,.55);backdrop-filter:blur(6px)}
label{display:block;font-weight:700;margin-bottom:8px;color:var(--gold-l)}
input{width:100%;font:inherit;font-size:1.1rem;padding:14px 16px;border-radius:14px;border:1px solid rgba(242,199,92,.45);background:rgba(0,0,0,.4);color:var(--ink);box-shadow:inset 0 3px 8px rgba(0,0,0,.6)}
input:focus{border-color:var(--gold)}
input[aria-invalid=true]{border-color:#ff9b8a}
.error{color:#ffb4a6;font-size:.92rem;margin:8px 0 0;min-height:1.3em}
button,.btn{font:inherit;font-weight:700;cursor:pointer;border-radius:16px;padding:14px 22px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;position:relative;
 color:var(--gold-l);border:1px solid rgba(242,199,92,.6);background:linear-gradient(180deg,#3a2a0e,#1c1306);
 box-shadow:inset 0 1px 0 rgba(255,241,184,.3),0 5px 0 #3d2707,0 10px 18px rgba(0,0,0,.5);transition:transform .12s ease,box-shadow .12s ease,filter .12s}
button:hover,.btn:hover{filter:brightness(1.12);transform:translateY(-1px)}
button:active,.btn:active{transform:translateY(4px);box-shadow:inset 0 1px 0 rgba(255,241,184,.3),0 1px 0 #3d2707,0 4px 8px rgba(0,0,0,.5)}
.primary{width:100%;margin-top:16px;font-size:1.15rem;letter-spacing:.04em;color:#2b1a02;border:1px solid #fff1b8;background:var(--metal);text-shadow:0 1px 0 rgba(255,241,184,.7);
 box-shadow:inset 0 2px 0 rgba(255,255,255,.7),inset 0 -3px 0 rgba(110,71,16,.35),0 6px 0 var(--gold-x),0 14px 24px rgba(0,0,0,.55),0 0 34px rgba(242,199,92,.35)}
.primary:active{box-shadow:inset 0 2px 0 rgba(255,255,255,.7),0 2px 0 var(--gold-x),0 6px 10px rgba(0,0,0,.5)}
.wa{color:#fff;border-color:#2fa463;background:linear-gradient(180deg,#1f8a4c,var(--wa));box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 5px 0 var(--wa-d),0 10px 18px rgba(0,0,0,.5)}
.wa:active{box-shadow:0 1px 0 var(--wa-d),0 4px 8px rgba(0,0,0,.5)}
:focus-visible{outline:3px solid #fff;outline-offset:4px}
.footnote{text-align:center;color:var(--muted);margin-top:28px;font-family:Georgia,serif;font-style:italic}
footer{margin-top:auto;padding-top:40px;text-align:center;color:var(--muted);font-size:.8rem}
#home{flex:1;display:flex;flex-direction:column}
#home form{margin-top:auto}
#home .footnote{margin-bottom:0}
body[data-view=home] footer{padding-top:16px}
h1{white-space:nowrap}
.church{margin:0 0 6px}
.church{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-weight:800;font-size:clamp(1.15rem,5.6vw,2.2rem);letter-spacing:.01em}
/* verse view */
.scene{position:fixed;inset:0;width:100%;height:100%;z-index:-1;display:none}
body[data-view=home] .scene{display:block}
.card-bg{position:absolute;inset:0;width:100%;height:100%;border-radius:inherit;z-index:0}
.card>*:not(.card-bg){position:relative;z-index:1}
.card::before{z-index:1}

.card{position:relative;border-radius:24px;padding:46% 28px 40px;text-align:center;transform-style:preserve-3d;
 background:radial-gradient(120% 60% at 50% 0%,rgba(242,199,92,.22),rgba(242,199,92,0) 65%),linear-gradient(170deg,#2e2009,#140d04);
 border:2px solid transparent;background-clip:padding-box;
 box-shadow:0 0 0 2px #c4892a,inset 0 1px 0 rgba(255,241,184,.35),0 8px 0 #3d2707,0 30px 60px rgba(0,0,0,.6),0 0 60px rgba(242,199,92,.18);
 transform:rotateX(4deg);transition:transform .3s ease}
.card:hover{transform:rotateX(0deg) translateY(-2px)}
.card::before{content:"";position:absolute;inset:10px;border:1px solid rgba(242,199,92,.4);border-radius:16px;pointer-events:none}
blockquote{margin:0;font-family:Georgia,serif;font-size:clamp(1.7rem,6.2vw,2.5rem);line-height:1.4;outline:none;color:var(--ink);text-shadow:0 2px 0 rgba(0,0,0,.45),0 6px 18px rgba(0,0,0,.4)}
#verse{margin:auto 0}
.ref{margin:28px 0 0;color:var(--gold);letter-spacing:.14em;text-transform:uppercase;font-size:.92rem;font-weight:700}
.blessing{margin:14px 0 0;font-family:Georgia,serif;font-style:italic;color:var(--muted);font-size:.95rem}
.name{margin:22px 0 0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:800;font-size:1.45rem;letter-spacing:.02em;overflow-wrap:anywhere;color:var(--gold);filter:drop-shadow(0 2px 0 #6e4710)}
@supports (-webkit-background-clip:text) or (background-clip:text){.name{background:var(--metal);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:26px}
.actions .full{grid-column:1/-1}
.hint{font-size:.85rem;color:var(--muted);text-align:center;margin:12px 0 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--metal);color:#2b1a02;padding:10px 18px;border-radius:999px;font-weight:700;box-shadow:0 4px 0 var(--gold-x),0 10px 30px rgba(0,0,0,.5)}
.reveal{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 45%,#3a2809,var(--bg1) 70%);z-index:5;gap:18px}
.glow{width:130px;height:130px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff1b8,#f2c75c 35%,rgba(224,169,58,.6) 55%,rgba(224,169,58,0) 72%);animation:pulse 1.4s ease-in-out infinite}
.reveal p{font-family:Georgia,serif;font-style:italic;font-size:1.3rem;margin:0;color:var(--gold-l)}
.fade{animation:fade .6s ease both}
#verse .card.fade{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes pulse{0%,100%{transform:scale(.8);opacity:.6}50%{transform:scale(1.1);opacity:1}}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:rotateX(18deg) translateY(30px)}to{opacity:1;transform:rotateX(4deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.card{transform:none}}
@media (max-width:420px){.actions{grid-template-columns:1fr}main{padding-top:32px}.card{padding:46% 20px 32px}}
</style>
</head>
<body data-view="home">
<canvas class="scene" id="bg" aria-hidden="true"></canvas>
<main>
  <!-- HOME -->
  <section id="home" aria-labelledby="home-title" class="fade">
    <p class="church gold-text">Restoration Mission in Christ (RMIC) Church</p>
    <h1 id="home-title" class="gold-text">New Year Promise <span data-year></span></h1>

    <form id="form" novalidate>
      <label for="name">Your name</label>
      <input id="name" name="name" autocomplete="given-name" maxlength="40" required aria-describedby="name-error">
      <p class="error" id="name-error" role="alert"></p>
      <button class="primary" type="submit">My Promise Word</button>
    </form>
    <p class="footnote">God’s promises never fail.</p>
  </section>

  <!-- VERSE VIEW -->
  <section id="verse" hidden aria-label="Your promise">
    <article class="card fade" aria-label="Your promise">
      <canvas class="card-bg" id="card-bg" aria-hidden="true"></canvas>
      <blockquote id="v-text" tabindex="-1"></blockquote>
      <p class="ref"><span id="v-ref"></span> · KJV</p>
      <p class="blessing" id="v-blessing"></p>
      <p class="name" id="v-name"></p>
    </article>
    <div class="actions">
      <button type="button" class="wa full" id="wa"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.1 5.1 0 0 0 1.1 2.7 11.7 11.7 0 0 0 4.5 4c1.7.7 2.3.8 3.2.7.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3z"/></svg>Share on WhatsApp</button>
      <button type="button" id="dl">Download card</button>
      <button type="button" id="again">Start again</button>
    </div>
    <p class="hint" id="share-hint">Opens your phone’s share menu. Choose WhatsApp to send the card.</p>
  </section>

  <footer>Scripture: King James Version (Public Domain).</footer>
</main>

<div class="reveal" id="reveal" hidden aria-live="polite"><div class="glow" aria-hidden="true"></div><p>God has a promise for you…</p></div>

  function shuffle(a) {

    // Name: bottom centre, bold sans-serif (a different font from the verse)
    var fs = 58; x.font = '800 ' + fs + 'px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
    while (x.measureText(current.name).width > W - 200 && fs > 30) { fs -= 2; x.font = '800 ' + fs + 'px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'; }
    var nl = wrap(x, current.name, W - 200);
    for (var k = 0; k < nl.length; k++) {
      var ny = 1232 + (k - (nl.length - 1)) * fs * 1.15;
      x.fillStyle = '#5a3a0c'; x.fillText(nl[k], W / 2, ny + 4); // 3D depth
      x.save(); x.shadowColor = 'rgba(0,0,0,.6)'; x.shadowBlur = 12; x.shadowOffsetY = 6; x.fillStyle = metal(ny - fs, ny); x.fillText(nl[k], W / 2, ny); x.restore();
    }
    return c;
  }
  $('dl').addEventListener('click', function () {
    (current.blob ? Promise.resolve(current) : pending).then(function (m) {
      if (!m.blob) { toast('Sorry, the image could not be made'); return; }
      download(m.blob); toast('Card downloaded');
    });
  });

  paintAll(); photoReady.then(paintAll);

  window.__MNYP_LITE__ = { count: VERSES.length, verses: VERSES, nextIndex: nextIndex, drawCard: function (v) { var keep = current; if (v) current = { text: v[1], ref: v[0], name: v[2] || 'Sarah', blessing: BLESSINGS[1] }; var c = drawCard(); current = keep; return c.toDataURL('image/jpeg', 0.9); }, ready: function () { return photoReady.then(function () { return !!photo; }); } };
})();
</script>
